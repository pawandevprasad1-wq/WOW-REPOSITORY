<div id="results" class="results-grid"></div>

<script>
async function runSearch() {
    const loc = document.getElementById('searchInput').value;
    const res = await fetch(`/search?location=${loc}`);
    const data = await res.json();
    
    const container = document.getElementById('results');
    container.innerHTML = '';
    
    data.forEach(item => {
        // IMAGES या images दोनों चेक करेगा
        const imgList = item.IMAGES || item.images || [];
        const firstImg = Array.isArray(imgList) ? imgList[0] : imgList;

        container.innerHTML += `
            <div class="card" onclick="window.location.href='/property/${item._id}'" style="cursor:pointer; border:1px solid #ccc; margin:10px; padding:10px;">
                <img src="${firstImg}" style="width:100px; height:100px;">
                <h3>${item.title || 'Property'}</h3>
                <p>Location: ${item.location}</p>
            </div>
        `;
    });
}
</script>
