<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Finder - Search</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 0; }
        .hero { background: #0073e6; padding: 80px 20px; text-align: center; color: white; }
        .search-container { position: relative; max-width: 600px; margin: 0 auto; }
        input[type="text"] { width: 100%; padding: 15px; font-size: 18px; border: none; border-radius: 5px; box-sizing: border-box; }
        .suggestions { position: absolute; top: 55px; left: 0; width: 100%; background: white; border-radius: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); z-index: 1000; color: #333; text-align: left; max-height: 250px; overflow-y: auto; }
        .suggestion-item { padding: 12px 15px; border-bottom: 1px solid #eee; cursor: pointer; }
        .suggestion-item:hover { background: #f0f0f0; color: #0073e6; }
    </style>
</head>
<body>

<div class="hero">
    <h1>कोलकाता में अपनी पसंदीदा लोकेशन खोजें</h1>
    <div class="search-container">
        <input type="text" id="searchBox" placeholder="लोकेशन टाइप करें (जैसे Purbalok, Garia, Mukundpur)..." autocomplete="off">
        <div id="suggestions" class="suggestions"></div>
    </div>
</div>

<script>
    const searchBox = document.getElementById('searchBox');
    const suggestions = document.getElementById('suggestions');

    searchBox.addEventListener('input', async function() {
        const query = this.value.trim();
        if (query.length < 1) {
            suggestions.innerHTML = '';
            return;
        }

        const response = await fetch(`/api/search_location?q=${encodeURIComponent(query)}`);
        const locations = await response.json();

        suggestions.innerHTML = '';
        locations.forEach(loc => {
            const div = document.createElement('div');
            div.className = 'suggestion-item';
            div.innerText = loc;
            div.onclick = function() {
                window.location.href = `/listings?location=${encodeURIComponent(loc)}`;
            };
            suggestions.appendChild(div);
        });
    });
</script>

</body>
</html>
